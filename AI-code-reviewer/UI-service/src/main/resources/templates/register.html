<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">

                    <h3>Create Account</h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/register}" method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    name="username"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    name="confirmPassword"
                                    required>

                        </div>

                        <button
                                class="btn btn-success w-100">

                            Register

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        Already have an account?

                        <a th:href="@{/login}">
                            Login
                        </a>

                    </div>

                    <div
                            class="alert alert-danger mt-3"
                            th:if="${error!=null}"
                            th:text="${error}">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
